name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared-ingest-seal
          pip install -e "core-engine[dev]"

      - name: Run Ruff (linter & formatter)
        run: |
          ruff check core-engine/
          ruff format --check core-engine/

      - name: Run Mypy (strict typechecking on core)
        run: |
          mypy --config-file core-engine/pyproject.toml core-engine/src/ --strict

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: stratos
          POSTGRES_USER: stratos_user
          POSTGRES_PASSWORD: stratos_secret_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared-ingest-seal
          pip install -e "core-engine[dev]"

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://stratos_user:stratos_secret_2026@localhost:5432/stratos
          APP_DATABASE_URL: postgresql+asyncpg://stratos_app:stratos_app_secret_2026@localhost:5432/stratos
          APP_DB_PASSWORD: stratos_app_secret_2026
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-jwt-secret
          INGEST_API_KEYS: ci-test-ingest-key
        run: |
          cd core-engine
          # test_g8_acceptance_criteria.py necesita una BBDD ya sembrada por
          # scripts/seed.py (lee "stratos" directo, no el sandbox stratos_test
          # que crea tests/conftest.py para el resto de la suite) -- ese
          # sembrado es tarea del job e2e-acceptance-full, no de este job.
          # Hallazgo real: sin este --ignore, el push que introdujo el archivo
          # rompio test-backend (9 fallos, "relation bot does not exist" --
          # "stratos" nunca se migra en este job).
          pytest -v --ignore=tests/e2e/test_g8_acceptance_criteria.py

  lint-mt5-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Orden de instalacion no trivial (G4): mt5-connector[dev] depende de
      # mt5-simulator, que a su vez depende de mt5-connector (base, sin
      # [dev]) -- ninguno esta en un indice publico, asi que hay que
      # instalar en 2 pasadas para que pip resuelva cada extra contra lo ya
      # presente en el entorno, no contra PyPI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared-ingest-seal
          pip install -e mt5-connector
          pip install -e "mt5-simulator[dev]"
          pip install -e "mt5-connector[dev]"

      - name: Run Ruff (linter & formatter)
        run: |
          ruff check mt5-connector/
          ruff format --check mt5-connector/

      - name: Run Mypy (strict typechecking)
        run: |
          mypy --config-file mt5-connector/pyproject.toml mt5-connector/src/ --strict

  test-mt5-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sin Postgres/Redis: todos los tests de mt5-connector son locales
      # (SQLite del buffer, httpx.MockTransport/ASGITransport) -- el
      # paquete `MetaTrader5` real (Windows-only) nunca se instala aqui.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared-ingest-seal
          pip install -e mt5-connector
          pip install -e "mt5-simulator[dev]"
          pip install -e "mt5-connector[dev]"

      - name: Run Pytest
        run: |
          cd mt5-connector
          pytest -v

  lint-and-test-mt5-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared-ingest-seal
          pip install -e mt5-connector
          pip install -e "mt5-simulator[dev]"

      - name: Run Ruff (linter & formatter)
        run: |
          ruff check mt5-simulator/
          ruff format --check mt5-simulator/

      - name: Run Mypy (strict typechecking)
        run: |
          mypy --config-file mt5-simulator/pyproject.toml mt5-simulator/src/ --strict

      - name: Run Pytest
        run: |
          cd mt5-simulator
          pytest -v

  # G9: api-gateway deja de ser el placeholder de G0 (ver ASSUMPTIONS G4-21/
  # docs/backlog.md) -- primer job de CI para este paquete. Sin servicios
  # Postgres/Redis: los tests usan fakeredis + httpx.MockTransport, cero
  # infra real necesaria (mismo criterio que mt5-simulator).
  lint-and-test-api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "api-gateway[dev]"

      - name: Run Ruff (linter & formatter)
        run: |
          ruff check api-gateway/
          ruff format --check api-gateway/

      - name: Run Mypy (strict typechecking)
        run: |
          mypy --config-file api-gateway/pyproject.toml api-gateway/src/ --strict

      - name: Run Pytest
        run: |
          cd api-gateway
          pytest -v

  test-integration:
    runs-on: ubuntu-latest
    # Criterio de salida de G4 (PARTE 12): unico job que instala los 3
    # paquetes a la vez contra Postgres real (mismos servicios que
    # test-backend -- integration-tests corre contra stratos_test real).
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: stratos
          POSTGRES_USER: stratos_user
          POSTGRES_PASSWORD: stratos_secret_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared-ingest-seal
          pip install -e "core-engine[dev]"
          pip install -e mt5-connector
          pip install -e "mt5-simulator[dev]"
          pip install -e "mt5-connector[dev]"
          pip install pytest pytest-asyncio asyncpg

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://stratos_user:stratos_secret_2026@localhost:5432/stratos
          APP_DATABASE_URL: postgresql+asyncpg://stratos_app:stratos_app_secret_2026@localhost:5432/stratos
          APP_DB_PASSWORD: stratos_app_secret_2026
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-jwt-secret
          INGEST_API_KEYS: ci-test-ingest-key
        run: |
          cd integration-tests
          pytest -v

  lint-and-build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Unit tests (Vitest)
        run: |
          cd frontend
          npm run test

      - name: TypeScript check & Build
        run: |
          cd frontend
          npm run build

  # G8 (PARTE 12, "Seed + E2E"): siembra --profile ci --reset (rapido,
  # ~4 meses de historia) contra Postgres/Redis reales, arranca
  # core-engine (uvicorn) + frontend (vite) de verdad, y corre el harness
  # Playwright completo (11 specs) contra ambos. --workers=1: el
  # screenshot-diff es sensible a contencion de CPU bajo paralelismo alto
  # (hallazgo real de G8, ver ASSUMPTIONS.md/backlog.md) -- retries:2 ya
  # esta en playwright.config.ts para el resto de flakiness transitoria.
  e2e-playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: stratos
          POSTGRES_USER: stratos_user
          POSTGRES_PASSWORD: stratos_secret_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://stratos_user:stratos_secret_2026@localhost:5432/stratos
      APP_DATABASE_URL: postgresql+asyncpg://stratos_app:stratos_app_secret_2026@localhost:5432/stratos
      APP_DB_PASSWORD: stratos_app_secret_2026
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-jwt-secret
      INGEST_API_KEYS: ci-test-ingest-key
      PLAYWRIGHT_TEST_EMAIL: e2e-ci@stratos.local
      PLAYWRIGHT_TEST_PASSWORD: ci-test-password-2026
      PLAYWRIGHT_BASE_URL: http://localhost:5175
      VITE_API_BASE_URL: http://localhost:8100

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared-ingest-seal
          pip install -e "core-engine[dev]"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Migrate database
        run: |
          cd core-engine
          python -m alembic -c alembic.ini upgrade head

      - name: Seed --profile ci --reset
        run: |
          PYTHONPATH="core-engine/src:scripts" python scripts/seed.py --profile ci --reset

      - name: Start core-engine (background)
        run: |
          nohup python -m uvicorn --app-dir core-engine/src core.main:app --port 8100 \
            > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/health && break
            sleep 1
          done
          curl -sf http://localhost:8100/health

      - name: Start frontend (background)
        run: |
          cd frontend
          nohup npx vite --port 5175 --strictPort > ../vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5175/ && break
            sleep 1
          done
          curl -sf http://localhost:5175/

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright test --workers=1 --update-snapshots

      # TEMPORAL (G9): regenera cuentas-ea-chromium-linux.png (y cualquier
      # otro baseline que la staleness/conectividad relativa a "ahora" del
      # seed haya vuelto a desviar) con el estado REAL correcto de hoy --
      # mismo mecanismo exacto que G8-15. La causa real (headerMask solo
      # cubre `header .grid`, no el badge DATOS STALE que aparece/desaparece
      # como hermano segun `data_stale_seconds`, mas el bloque de
      # heartbeat/latencia de AccountCard que solo aparece si la cuenta esta
      # "conectada" -- ambos condicionados a la hora real de ejecucion, no
      # al seed) queda documentada en ASSUMPTIONS G9-06; enmascarar no basta
      # porque desplaza la altura de la pagina entera, no solo un valor.
      - name: Upload updated linux snapshots (temp)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-snapshots
          path: frontend/tests/e2e/**/*-linux.png
          retention-days: 7

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            uvicorn.log
            vite.log

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Perfil `full` (5,5 anos de historia) para los criterios de PARTE 16
  # que necesitan las cifras/calibraciones reales (ej. criterio 9, Lyra x
  # Phoenix redundante -- no se calibra bajo `ci`, ver ASSUMPTIONS G8).
  # Job aparte de e2e-playwright porque sembrar `full` es notablemente mas
  # lento que `ci` (no comparten seed, cada uno siembra el suyo).
  e2e-acceptance-full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: stratos
          POSTGRES_USER: stratos_user
          POSTGRES_PASSWORD: stratos_secret_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://stratos_user:stratos_secret_2026@localhost:5432/stratos
      APP_DATABASE_URL: postgresql+asyncpg://stratos_app:stratos_app_secret_2026@localhost:5432/stratos
      APP_DB_PASSWORD: stratos_app_secret_2026
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-jwt-secret
      INGEST_API_KEYS: ci-test-ingest-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e shared-ingest-seal
          pip install -e "core-engine[dev]"

      - name: Migrate database
        run: |
          cd core-engine
          python -m alembic -c alembic.ini upgrade head

      - name: Seed --profile full --reset
        run: |
          PYTHONPATH="core-engine/src:scripts" python scripts/seed.py --profile full --reset

      - name: Run acceptance criteria tests
        run: |
          cd core-engine
          pytest tests/e2e/test_g8_acceptance_criteria.py -v
