name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "core-engine[dev]"

      - name: Run Ruff (linter & formatter)
        run: |
          ruff check core-engine/
          ruff format --check core-engine/

      - name: Run Mypy (strict typechecking on core)
        run: |
          mypy core-engine/src/ --strict

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: stratos
          POSTGRES_USER: stratos_user
          POSTGRES_PASSWORD: stratos_secret_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "core-engine[dev]"

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://stratos_user:stratos_secret_2026@localhost:5432/stratos
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd core-engine
          pytest -v

  lint-and-build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: TypeScript check & Build
        run: |
          cd frontend
          npm run build
