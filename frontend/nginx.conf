# Servidor de ficheros estaticos DENTRO del contenedor `frontend` (distinto
# de infra/nginx/nginx.conf, que es el reverse-proxy de entrada del Nodo B
# completo -- este solo sirve el bundle de Vite). Sin `try_files` con
# fallback a index.html, cualquier ruta de React Router (/login,
# /portfolio, /bots/42...) navegada DIRECTA o refrescada devuelve el 404
# generico de nginx en vez de dejar que el router cliente la resuelva --
# solo "/" cargaba antes de este fix (hallazgo real de G9, primera vez
# que se probo el flujo completo detras de nginx con un navegador real).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
