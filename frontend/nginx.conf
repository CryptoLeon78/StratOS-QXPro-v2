# Servidor de ficheros estaticos DENTRO del contenedor `frontend` (distinto
# de infra/nginx/nginx.conf, que es el reverse-proxy de entrada del Nodo B
# completo -- este solo sirve el bundle de Vite). Sin `try_files` con
# fallback a index.html, cualquier ruta de React Router (/login,
# /portfolio, /bots/42...) navegada DIRECTA o refrescada devuelve el 404
# generico de nginx en vez de dejar que el router cliente la resuelva --
# solo "/" cargaba antes de este fix (hallazgo real de G9, primera vez
# que se probo el flujo completo detras de nginx con un navegador real).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # G12 expone este contenedor directamente para mantener el entorno demo
    # aislado en un puerto propio. Conservamos el mismo contrato de entrada
    # que el nginx externo de produccion: Vite usa /api y /ws, nunca una URL
    # de core-engine ni del conector MT5. El gateway sigue siendo la unica
    # frontera HTTP y no adquiere ninguna capacidad de ordenes.
    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://api-gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
