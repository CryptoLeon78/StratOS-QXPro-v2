[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratos-ingest-seal"
version = "0.1.0"
description = "StratOS-QXPro: sellado SHA-256 de lotes de ingesta (PARTE 6/9.1). Stdlib-only (hashlib+json) a proposito: lo comparten core-engine (servidor, dependencias pesadas) y mt5-connector (servicio Windows ligero), y ninguno de los dos debe arrastrar el arbol de dependencias del otro."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_seal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
