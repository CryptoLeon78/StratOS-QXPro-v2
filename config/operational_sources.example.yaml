# Copiar a runtime/operational/sources.yaml. No guardar rutas de cuentas ni
# credenciales en Git. El importador acepta solo rutas locales declaradas aqui.
sources:
  - group: REAL
    terminal_alias: contabo_jjti
    account_label: JJTI
  - group: REAL
    terminal_alias: contabo_bepb
    account_label: BEPB
  - group: INCUBATOR
    terminal_data_root: C:\\path\\to\\MetaQuotes\\Terminal\\incubator
