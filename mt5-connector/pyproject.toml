[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratos-mt5-connector"
version = "0.1.0"
description = "StratOS-QXPro mt5-connector: servicio Windows read-only (PARTE 3/G4). Polling MT5 -> buffer SQLite store-and-forward -> POST /ingest/* sellado. NUNCA envia ordenes (P4)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "stratos-ingest-seal>=0.1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
]
# El paquete MetaTrader5 (PyPI, Windows-only, requiere terminal instalado)
# NO se declara aqui a proposito: real_adapter.py lo importa de forma
# perezosa (dentro de cada metodo, nunca a nivel de modulo) precisamente
# para que este paquete se pueda instalar/testear en Linux CI sin el.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.12",
    "stratos-mt5-simulator>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
