[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratos-mt5-simulator"
version = "0.1.0"
description = "StratOS-QXPro mt5-simulator (PARTE 7/12, P7): sustituto de MetaTrader5 real para testear mt5-connector sin terminal. Implementa Mt5ClientProtocol estructuralmente."
requires-python = ">=3.12,<3.13"
dependencies = [
    "stratos-mt5-connector>=0.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
