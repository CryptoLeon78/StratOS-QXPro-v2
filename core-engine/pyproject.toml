[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratos-core-engine"
version = "0.1.0"
description = "StratOS-QXPro core-engine: dominio, formulas, maquinas de estado y API (FastAPI async)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.1",
    "arq>=0.26",
    "httpx>=0.27",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "factory_boy>=3.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.12",
    "pandas-stubs>=2.2",
]
sentry = ["sentry-sdk[fastapi]>=2.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# alembic/versions/ es codigo generado (alembic revision --autogenerate) que
# .claude/settings.json ya bloquea editar a mano; no se reformatea ni se lint-ea.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# statsmodels no distribuye stubs ni py.typed; sin esto mypy --strict no
# puede analizar core/formulas/portfolio.py en absoluto (import-untyped).
module = "statsmodels.*"
ignore_missing_imports = true
