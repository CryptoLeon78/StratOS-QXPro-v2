[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratos-core-engine"
version = "0.1.0"
description = "StratOS-QXPro core-engine: dominio, formulas, maquinas de estado y API (FastAPI async)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Paquete local (G4): canonicalizacion + SHA-256 de lotes de ingesta,
    # compartido con mt5-connector -- ver shared-ingest-seal/pyproject.toml
    # para el porque de un paquete propio en vez de depender de core-engine
    # al reves. Se instala por separado (pip install -e shared-ingest-seal)
    # antes de instalar core-engine; no esta en ningun indice publico.
    "stratos-ingest-seal>=0.1.0",
    "fastapi>=0.115",
    # FastAPI lo exige en runtime (no solo en type-checking) para construir
    # cualquier ruta con Form()/OAuth2PasswordRequestForm -- auth/router.py
    # POST /token lo usa. Sin esto declarado, un venv local que lo tenga
    # instalado de forma incidental (transitiva de otro paquete) esconde el
    # fallo hasta un venv limpio (encontrado via el primer CI real de G5).
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.1",
    "arq>=0.26",
    "httpx>=0.27",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "factory_boy>=3.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.12",
    "pandas-stubs>=2.2",
    "fakeredis>=2.24",
]
sentry = ["sentry-sdk[fastapi]>=2.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# SQLAlchemy async (asyncpg) puentea DBAPI sincrono via greenlet
# (greenlet_spawn/await_only) -- sin esto, coverage.py pierde el rastro de
# cualquier linea que este "al otro lado" de un `await session.execute(...)`
# (descubierto al medir las primeras rutas HTTP reales, G4: rutas con
# resolve_account/ingest_trades aparecian falsamente sin cubrir).
concurrency = ["greenlet"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# alembic/versions/ es codigo generado (alembic revision --autogenerate) que
# .claude/settings.json ya bloquea editar a mano; no se reformatea ni se lint-ea.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 asume que una funcion en un default de argumento es siempre un bug;
# Depends/Header/Query/etc son el patron de inyeccion de dependencias propio
# de FastAPI (PARTE 9.1 ingest/), no un error.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# statsmodels no distribuye stubs ni py.typed; sin esto mypy --strict no
# puede analizar core/formulas/portfolio.py en absoluto (import-untyped).
module = "statsmodels.*"
ignore_missing_imports = true
