[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratos-api-gateway"
version = "0.1.0"
description = "StratOS-QXPro api-gateway: proxy transparente + rate-limit + WS broker hacia core-engine (G9, PARTE 3/12)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "redis>=5.0",
    "websockets>=13.0",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "fakeredis>=2.24", "ruff>=0.7", "mypy>=1.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 asume que una funcion en un default de argumento es siempre un bug;
# Depends es el patron de inyeccion de dependencias propio de FastAPI --
# mismo criterio que core-engine/pyproject.toml.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
