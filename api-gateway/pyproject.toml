[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratos-api-gateway"
version = "0.1.0"
description = "StratOS-QXPro api-gateway: JWT, rate limit, WS broker hacia core-engine. Placeholder de G0, implementacion real en G5."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
target-version = "py312"
line-length = 100
