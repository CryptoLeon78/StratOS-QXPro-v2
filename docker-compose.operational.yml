# Stack sin fixture. Ejecutar siempre con:
# docker compose -p stratos_operational -f docker-compose.yml -f docker-compose.operational.yml --env-file .env.operational up -d
services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: !override
      - "57432:5432"
    volumes: !override
      - operational-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    restart: unless-stopped
    ports: !override
      - "6580:6379"
  core-engine:
    restart: unless-stopped
    env_file: !override
      - .env.operational
    ports: !override
      - "8300:8000"
    volumes:
      - ./runtime/operational:/runtime:ro
  worker:
    restart: unless-stopped
    env_file: !override
      - .env.operational
  scheduler:
    restart: unless-stopped
    env_file: !override
      - .env.operational
  api-gateway:
    restart: unless-stopped
    env_file: !override
      - .env.operational
    ports: !override
      - "8380:8080"
  frontend:
    restart: unless-stopped
    build:
      args:
        VITE_OPERATIONAL_MODE: operational
    ports: !override
      - "5473:80"
volumes:
  operational-postgres-data:
