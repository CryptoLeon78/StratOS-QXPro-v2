# Stack sin fixture. Ejecutar siempre con:
# docker compose -p stratos_operational -f docker-compose.yml -f docker-compose.operational.yml --env-file .env.operational up -d
services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: !override
      - "57432:5432"
    volumes: !override
      - operational-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    restart: unless-stopped
    ports: !override
      - "6580:6379"
  core-engine:
    restart: unless-stopped
    env_file: !override
      - .env.operational
    # 4 procesos uvicorn (ver Dockerfile) x (5+5) = 40 conexiones max desde
    # aqui. Sumado a worker+scheduler (10+10) deja 60 de 100
    # (max_connections de Postgres), con margen -- antes cada uno de los 3
    # procesos podia pedir hasta 40 (20+20 por defecto), 120 combinados,
    # por encima del techo real. Hallazgo real, 2026-09-28.
    environment:
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
    ports: !override
      - "8300:8000"
    volumes:
      - ./runtime/operational:/runtime:ro
  worker:
    restart: unless-stopped
    env_file: !override
      - .env.operational
    environment:
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
  scheduler:
    restart: unless-stopped
    env_file: !override
      - .env.operational
    environment:
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
  api-gateway:
    restart: unless-stopped
    env_file: !override
      - .env.operational
    ports: !override
      - "8380:8080"
  frontend:
    restart: unless-stopped
    build:
      args:
        VITE_OPERATIONAL_MODE: operational
    ports: !override
      - "5473:80"
volumes:
  operational-postgres-data:
